name: Automated Skill Ingestion & Sync

on:
  schedule:
    # Run three times a week: Monday, Wednesday, and Friday at 01:00 UTC (08:00 AM VN time)
    - cron: '0 1 * * 1,3,5'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Sync execution mode (auto, ingest-only, update-only)'
        required: true
        type: choice
        options:
          - auto
          - ingest-only
          - update-only
        default: 'auto'
      github_repo:
        description: 'Upstream GitHub repo (owner/repo) [optional for manual ingest]'
        required: false
        default: ''
      skill_path:
        description: 'Directory path to skill inside repo [optional for manual ingest]'
        required: false
        default: ''
      category:
        description: 'Target ecosystem category'
        required: false
        type: choice
        options:
          - general
          - anthropic
          - openai
          - google
        default: 'anthropic'
      dry_run:
        description: 'Dry run check without writing changes'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  sync:
    name: Ingest, Verify & Auto-Merge
    runs-on: ubuntu-latest

    steps:
      - name: Generate GitHub App Token (xinbato-skill)
        id: app-token
        if: ${{ secrets.APP_ID != '' && secrets.APP_PRIVATE_KEY != '' }}
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token || secrets.SYNC_BOT_PAT || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run Ingestion & Security Verification
        id: sync
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || secrets.SYNC_BOT_PAT || secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_MODE: ${{ inputs.mode || 'auto' }}
          INPUT_REPO: ${{ inputs.github_repo || '' }}
          INPUT_PATH: ${{ inputs.skill_path || '' }}
          INPUT_CATEGORY: ${{ inputs.category || 'anthropic' }}
          INPUT_DRY_RUN: ${{ inputs.dry_run || false }}
        run: |
          EXTRA_ARGS=()
          if [ "$INPUT_DRY_RUN" = "true" ]; then
            EXTRA_ARGS+=(--dry-run)
          fi

          if [ "$EVENT_NAME" = "schedule" ]; then
            echo "Running scheduled auto-sync (limit: 1 skill)..."
            python scripts/sync_skills.py --auto-sync --mode auto --limit 1 --output-pr-data pr_scorecard.md || true
          elif [ -n "$INPUT_REPO" ] && [ -n "$INPUT_PATH" ]; then
            echo "Running manual ingestion for $INPUT_PATH from $INPUT_REPO..."
            python scripts/sync_skills.py \
              --github-repo "$INPUT_REPO" \
              --skill-path "$INPUT_PATH" \
              --category "$INPUT_CATEGORY" \
              "${EXTRA_ARGS[@]}" \
              --output-pr-data pr_scorecard.md || true
          else
            echo "Running auto-sync with mode: $INPUT_MODE..."
            python scripts/sync_skills.py \
              --auto-sync \
              --mode "$INPUT_MODE" \
              "${EXTRA_ARGS[@]}" \
              --output-pr-data pr_scorecard.md || true
          fi

      - name: Create Security Alert Issue
        if: steps.sync.outputs.verdict == 'REJECTED_SECURITY'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.SYNC_BOT_PAT || secrets.GITHUB_TOKEN }}
          SKILL_NAME: ${{ steps.sync.outputs.skill_name }}
          INPUT_PATH: ${{ inputs.skill_path }}
        run: |
          TARGET="${SKILL_NAME:-$INPUT_PATH}"
          gh issue create \
            --title "🚨 [Security Alert] Skill Ingestion Blocked: ${TARGET:-Unknown}" \
            --body "The automated ingestion pipeline blocked a skill candidate due to security violations. Please review the run logs and step summary for detailed findings." \
            --label "security,automated-alert"

      - name: Push Branch and Auto-Merge PR
        if: steps.sync.outputs.has_pr == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.SYNC_BOT_PAT || secrets.GITHUB_TOKEN }}
          SKILL_NAME: ${{ steps.sync.outputs.skill_name }}
          ACTION_TYPE: ${{ steps.sync.outputs.action }}
        run: |
          BOT_NAME="${{ steps.app-token.outputs.app-slug || 'xinbato-skill' }}[bot]"
          BOT_EMAIL="${{ steps.app-token.outputs.app-slug || 'xinbato-skill' }}[bot]@users.noreply.github.com"
          git config user.name "$BOT_NAME"
          git config user.email "$BOT_EMAIL"

          BRANCH="sync/skill-${SKILL_NAME:-update}-${{ github.run_id }}"
          git checkout -b "$BRANCH"
          git add .

          if git diff --staged --quiet; then
            echo "No changes to commit. Exiting."
            exit 0
          fi

          COMMIT_MSG="feat(skills): ${ACTION_TYPE:-ingest} ${SKILL_NAME}"
          git commit -m "$COMMIT_MSG"
          git push origin "$BRANCH"

          PR_TITLE="🤖 [Skill Ingest] ${SKILL_NAME}"
          PR_URL=$(gh pr create \
            --title "$PR_TITLE" \
            --body-file pr_scorecard.md \
            --head "$BRANCH" \
            --base main \
            --label "skill-sync,automated-ingest")

          echo "Created PR: $PR_URL"
          echo "Merging PR into main..."
          gh pr merge "$PR_URL" --squash --delete-branch || gh pr merge "$PR_URL" --auto --squash --delete-branch
