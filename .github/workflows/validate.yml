name: CI Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Repository Validation & Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run Linters & Validation Checks
        run: |
          python scripts/validate_skills.py
          node scripts/validate-skills.js
          node scripts/validate-commands.js
          node scripts/validate-reference-links.js
          node scripts/validate-versions.js
          node scripts/validate-artifact-paths.js

      - name: Run Unit Tests & Hygiene Suite
        run: |
          python -m unittest scripts/test_ingestion_pipeline.py
          python -m unittest scripts/test_hygiene.py
          node --test \
            scripts/validate-artifact-paths-test.js \
            scripts/validate-commands-test.js \
            scripts/validate-reference-links-test.js \
            scripts/validate-versions-test.js \
            scripts/lib/skill-lint-test.js
